<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Laboratorium — JIMP</title>
  <link rel="stylesheet" href="../assets/style.css">
  <!-- Ciemny motyw kolorowania kodu (C, Bash, JSON itd.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">
  <style>
    /* Ciemne bloki kodu niezależnie od stylów ogólnych strony. */
    .lesson-main pre {
      background: #282c34;
      border: 1px solid #3e4451;
      border-radius: 8px;
    }
    .lesson-main pre code.hljs {
      display: block;
      background: transparent;
      color: #abb2bf;
    }
  </style>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body>
  <header class="topbar"><div class="shell"><a class="brand" href="../">JIMP <span>· laboratoria</span></a><a class="toplink" href="../">← Wszystkie laboratoria</a></div></header>
  <main class="shell lesson">
    <div id="lab-number" class="eyebrow"></div>
    <h1 id="lab-title">Laboratorium</h1>
    <div id="lab-intro"></div>
    <div class="lesson-layout">
      <article id="lab-content" class="lesson-main" aria-live="polite"><p>Ładowanie instrukcji…</p></article>
      <aside id="lab-toc" class="lesson-toc" aria-label="Spis treści"></aside>
    </div>
  </main>
  <!-- Highlight.js jest ladowany przed skryptem generujacym tresc lekcji. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>
  <script src="../assets/lab-markdown.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var content = document.getElementById('lab-content');
      if (!content) return;

      function highlightCode() {
        if (!window.hljs) return;
        var blocks = content.querySelectorAll('pre code:not(.hljs)');
        blocks.forEach(function (block) {
          hljs.highlightElement(block);
        });
      }

      // Instrukcja Markdown jest wczytywana dynamicznie, wiec samo
      // hljs.highlightAll() przy starcie strony moze wykonac sie za wczesnie.
      var observer = new MutationObserver(highlightCode);
      observer.observe(content, { childList: true, subtree: true });
      highlightCode();
    });
  </script>
</body>
</html>
